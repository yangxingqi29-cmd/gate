name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check VPN Gate nodes and build Pages
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ secrets.CHECK_WORKER }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "90"
          NODES_URL: "https://yangxingqi29-cmd.github.io/gate/nodes.txt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
